<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 232" role="img" aria-labelledby="title desc">
  <title id="title">跨境零售 AI Agent 中台架构</title>
  <desc id="desc">Web 或 API 经 FastAPI 进入 Orchestrator，按意图选择直路由、ReAct 或多 Agent 编排。LangGraph 编排五个内部业务 Agent，共用 RAG、记忆、生图和 MCP 能力，底层使用 PostgreSQL、Redis 与 Qdrant。</desc>
  <style>
    svg { color-scheme: light dark; --bg: #eef2ff; --line: #a9b8e9; --ink: #192a67; --sub: #425387; --arrow: #3a57bc; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #263257; --line: #536ba8; --ink: #edf1ff; --sub: #ccd7f9; --arrow: #b0c3ff; }
    }
    rect { fill: var(--bg); stroke: var(--line); }
    .wire { fill: none; stroke: var(--arrow); stroke-width: 1.6; }
    .edge { marker-end: url(#arrow); }
    marker path { fill: var(--arrow); }
    text { text-anchor: middle; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; fill: var(--ink); font-size: 14px; font-weight: 700; }
    .note { fill: var(--sub); font-size: 12px; font-weight: 500; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3 0 6Z"/></marker></defs>
  <g class="wire">
    <path class="edge" d="M99 34H117"/>
    <path class="edge" d="M287 34H305"/>
    <path d="M380 61V79M51 79H411"/>
    <path class="edge" d="M51 79V96"/>
    <path class="edge" d="M141 79V96"/>
    <path class="edge" d="M231 79V96"/>
    <path class="edge" d="M321 79V96"/>
    <path class="edge" d="M411 79V96"/>
    <path d="M51 139V151H411V139M141 139V151M231 139V151M321 139V151"/>
    <path class="edge" d="M231 151V164"/>
    <path class="edge" d="M231 193V201"/>
  </g>
  <rect x="10" y="8" width="88" height="52" rx="8"/>

  <text class="note" x="54" y="47">FastAPI</text>
  <rect x="119" y="8" width="167" height="52" rx="8"/>
  <text x="202.5" y="24">Orchestrator</text>
  <text class="note" x="202.5" y="39">意图分级调度</text>

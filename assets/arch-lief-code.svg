<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 318" role="img">
  <title>Lief.code 架构图</title>
  <desc>Claude Code / Codex / Grok → 各自 adapter → 统一事件流 → 并排对话与任务看板 → Git 差异验收 → 验收或打回（带上下文返工）</desc>
  <style>
    svg { color-scheme: light dark; --bg: #eef2ff; --line: #a9b8e9; --ink: #192a67; --sub: #425387; --arrow: #3a57bc; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #263257; --line: #536ba8; --ink: #edf1ff; --sub: #ccd7f9; --arrow: #b0c3ff; }
    }
    rect { fill: var(--bg); stroke: var(--line); }
    .edge { fill: none; stroke: var(--arrow); stroke-width: 1.6; marker-end: url(#arrow); }
    .back { fill: none; stroke: var(--arrow); stroke-width: 1.4; stroke-dasharray: 4 3; marker-end: url(#arrow); }
    marker path { fill: var(--arrow); }
    text { text-anchor: middle; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; fill: var(--ink); font-size: 14px; font-weight: 700; }
    .note { fill: var(--sub); font-size: 12px; font-weight: 500; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3 0 6Z"/></marker></defs>
  <path class="edge" d="M 159 33 H 183"/>
  <path class="edge" d="M 263 63 V 85"/>
  <path class="edge" d="M 185 117 H 161"/>
  <path class="edge" d="M 81 147 V 169"/>
  <path class="edge" d="M 159 201 H 183"/>
  <path class="edge" d="M 263 231 V 253"/>
  <path class="back" d="M 185 285 H 40 V 233"/>
  <g transform="translate(5 5)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">3 家编程 Agent</text>
    <text class="note" x="76" y="42">Claude Code · Codex · Grok</text>
  </g>
  <g transform="translate(187 5)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">各自 adapter</text>
    <text class="note" x="76" y="42">逐行解析流式输出</text>
  </g>
  <g transform="translate(187 89)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">统一事件流</text>
    <text class="note" x="76" y="42">文本 · 工具 · 状态 · 错误</text>
  </g>
  <g transform="translate(5 89)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">指挥台</text>
    <text class="note" x="76" y="42">并排对话 · 任务看板</text>
  </g>
  <g transform="translate(5 173)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">派活执行</text>
    <text class="note" x="76" y="42">按工作目录 · 可停止</text>
  </g>
  <g transform="translate(187 173)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">Git 差异验收</text>
    <text class="note" x="76" y="42">status + diff</text>
  </g>
  <g transform="translate(187 257)">
    <rect width="152" height="56" rx="9"/>
    <text x="76" y="24">人：验收 / 打回</text>
    <text class="note" x="76" y="42">打回带上下文返工</text>
  </g>
</svg>

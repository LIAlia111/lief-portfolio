<svg xmlns="http://www.w3.org/2000/svg" width="344" height="318" viewBox="0 0 344 318" role="img" aria-labelledby="title desc">
  <title id="title">Lief.code 架构图</title>
  <desc id="desc">Windows 桌面端或本地 Web 接入本地 Node 服务。服务使用事件溯源编排、SQLite、Git 检查点和 MCP，并连接各家 Agent CLI，支持差异审阅、权限审批与 Git 回退。</desc>
  <style>
    svg { color-scheme: light dark; --bg: #eef2ff; --line: #a9b8e9; --ink: #192a67; --sub: #425387; --arrow: #3a57bc; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #263257; --line: #536ba8; --ink: #edf1ff; --sub: #ccd7f9; --arrow: #b0c3ff; }
    }
    rect { fill: var(--bg); stroke: var(--line); }
    .edge { fill: none; stroke: var(--arrow); stroke-width: 1.6; marker-end: url(#arrow); }
    marker path { fill: var(--arrow); }
    text { text-anchor: middle; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; fill: var(--ink); font-size: 14px; font-weight: 700; }
    .note { fill: var(--sub); font-size: 12px; font-weight: 500; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3 0 6Z"/></marker></defs>
  <path class="edge" d="M 172 56 V 73"/>
  <path class="edge" d="M 172 145 V 162"/>
  <path class="edge" d="M 172 234 V 251"/>
  <g transform="translate(21 8)">
    <rect width="302" height="46" rx="9"/>
    <text x="151" y="28">Windows 桌面端 / 本地 Web</text>
  </g>
  <g transform="translate(21 77)">
    <rect width="302" height="66" rx="9"/>
    <text x="151" y="21">本地 Node 服务</text>
    <text class="note" x="151" y="39">事件溯源编排 · SQLite</text>
    <text class="note" x="151" y="55">Git 检查点 · MCP</text>
  </g>
  <g transform="translate(21 166)">
    <rect width="302" height="66" rx="9"/>
    <text x="151" y="21">各家 Agent CLI</text>
    <text class="note" x="151" y="39">Codex · Claude Code · Cursor · Grok · OpenCode</text>
    <text class="note" x="151" y="55">Antigravity · Kiro · Pi · Muse Code · fx</text>
  </g>
  <g transform="translate(21 255)">
    <rect width="302" height="54" rx="9"/>
    <text x="151" y="32">差异审阅 / 权限审批 / Git 回退</text>
  </g>
</svg>
